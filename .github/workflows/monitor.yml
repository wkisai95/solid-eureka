name: Monitor sAERO
run-name: >-
  ${{ inputs.cycle && 'Monitor sAERO · ciclo'
  || inputs.options && 'Monitor sAERO · opzioni'
  || github.event_name == 'workflow_dispatch' && 'Monitor sAERO · avvio manuale'
  || github.event_name == 'schedule' && 'Monitor sAERO · programmato'
  || 'Monitor sAERO · aggiornamento' }}

on:
  schedule:
    # off the top of the hour: GitHub drops scheduled runs at its busiest minutes
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - "site/**"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Invia una notifica di prova"
        type: boolean
        default: false
      cycle:
        description: "Uso interno: giro automatico dopo la pausa dell'ambiente 'attesa'"
        type: boolean
        default: false
      options:
        description: "Uso interno: opzioni delle simulazioni inviate dalla pagina (JSON)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  wait:
    # Automatic cycle: the wait timer of the 'attesa' environment spaces the runs without holding a runner.
    if: ${{ inputs.cycle }}
    runs-on: ubuntu-latest
    environment: attesa
    timeout-minutes: 5
    steps:
      - run: echo "Pausa finita"

  monitor:
    needs: wait
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: radar-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore data from the data branch
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git archive refs/remotes/origin/data | tar -x -C out
            rm -f out/.keepalive_needed out/.skipped
          else
            echo "No data branch yet: first run"
          fi

      - name: Run monitor
        env:
          TEST_NOTIFY: ${{ inputs.test_notify }}
          # set as an environment variable, never pasted into a script: the monitor parses and checks it
          OPTIONS_JSON: ${{ inputs.options }}
          # automatic runs skip when another run collected less than 8 minutes ago; manual runs always collect
          MIN_INTERVAL_S: ${{ (github.event_name == 'schedule' || inputs.cycle) && '480' || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MY_POSITIONS: ${{ secrets.MY_POSITIONS }}
        run: python -m monitor.main --out out

      - name: Publish data branch
        run: |
          if [ -f out/.skipped ]; then echo "Nothing new to publish"; exit 0; fi
          cd out
          rm -rf .git
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="radar-saero-bot" -c user.email="radar-saero-bot@users.noreply.github.com" \
            commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub pauses scheduled workflows after 60 days without activity: re-enabling resets the timer
          if [ -f out/.keepalive_needed ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" && echo "Schedule refreshed"
          fi

  next:
    # Keeps exactly one automatic cycle waiting when the 'attesa' environment has a wait timer, whether or not
    # GitHub's schedule fires (overlapping automatic runs skip themselves). Runs after every run, so a manual
    # run also restarts a broken cycle.
    needs: monitor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Plan the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          wait_min=$(gh api "repos/$REPO/environments/attesa" \
            --jq '[.protection_rules[]? | select(.type == "wait_timer") | .wait_timer] | max // 0' 2>/dev/null | head -n1 || true)
          case "$wait_min" in ''|*[!0-9]*) wait_min=0 ;; esac
          if [ "$wait_min" -lt 5 ]; then
            echo "No wait timer on the 'attesa' environment: the next run is left to the schedule."
            exit 0
          fi
          pending=$(gh api "repos/$REPO/actions/workflows/monitor.yml/runs?event=workflow_dispatch&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\" and (.display_title | endswith(\"ciclo\")))] | length" \
            2>/dev/null | head -n1 || true)
          case "$pending" in ''|*[!0-9]*) echo "Could not list the runs: no new cycle"; exit 0 ;; esac
          if [ "$pending" -gt 0 ]; then
            echo "A cycle is already waiting."
            exit 0
          fi
          gh workflow run monitor.yml --repo "$REPO" --ref main -f cycle=true
          echo "Next cycle dispatched: it starts after the $wait_min-minute pause."
